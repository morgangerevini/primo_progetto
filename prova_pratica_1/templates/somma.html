{% extends 'base.html' %}

{% block title %}
  {{ block.super }} | IF
{% endblock title %}

{% block content %}
  <b>var1 = {{ var1 }}</b> <br/>
  <b>var2 = {{ var2 }}</b> <br/>

{% if var1 > var2 %}
    <p><i>var1 is greater than var2</i></p>
    <span style="color:chartreuse;" var1 ></span>
  {% endif %}

{% if var1 < var2 %}
    <p><i>var1 is smaller than var2 </i></p>
    <span style="color:darkred;" var1 ></span>
  {% endif %}
